    title: "Point. Capture. Reveal the depth.",
    intro: "LeafID turns a two-second glance into knowledge you keep. One loop runs through the whole product: discover, understand, keep, return.",

      { kicker: "Discover", title: "Know it in seconds.", text: "Name any plant from the camera or a past photo, with its family and an honest confidence score." },
      { kicker: "Understand", title: "Meet the plant, not just its name.", text: "Every species arrives with its traditional name, how people have used it across cultures, and its story. Knowing a plant becomes caring about it." },

  // ---- The Botanical Card showcase. Story text is real app content from the shared species cache. ----,

    intro: "The Botanical Card is where LeafID becomes more than an identifier. Tap the card to turn it over.",
    flipLabel: "Turn the card",

      scientific: "Acer pseudoplatanus",
      known: "Bergahorn",
      rarity: "Common",
      found: "Found on a morning walk",

    herbarium: { k: "Herbarium", title: "Specimen labels", text: "Each row reads like a label in a real herbarium: the plant, when, and where." },
    rows: [
      { common: "Sycamore maple", when: "Found 2 days ago", where: "City park", glyph: "redMaple", colors: ["#4A7C3A", "#C9B465", "#8B6D5C"] },

  decisions: {
    label: "Leadership calls",
    title: "Five calls that shaped LeafID.",
    intro: "The strategic decisions, each written up with its context, options and trade-offs in the app's decision log.",
    items: [
      {
        title: "Own meaning, not identification",
        decision: "Position LeafID on the story behind a plant, not on naming it or caring for it. Identification comes from a specialist service; the product's effort goes into the Botanical Card.",
        why: "Competing on identification accuracy means competing with well-funded incumbents on their ground. Meaning is open space, and it is the part people remember.",
        tradeoff: "The story is written by AI, so it can be wrong or missing. I moved it to the server, cached it per species so every walker reads the same text, and set an alert for any empty result.",
        evidence: "Decision records 0003, 0004"
      },
      {
        title: "Rebuild native, keep the backend",
        decision: "Replace the first version, a web app wrapped for iOS, with a native SwiftUI app, while keeping the same backend and data.",
        why: "LeafID lives in two moments: the camera, and a card you hold and flip. A web wrapper could not give them the native camera, haptics, VoiceOver and the latest iOS materials. A cross-platform rewrite was proposed first and set aside for the same reason.",
        tradeoff: "iPhone only at launch; Android waits. Months of rebuild instead of new features, contained by keeping the backend, so no data or accounts were lost.",
        evidence: "Decision record 0001 and the Swift migration guide, April 2026"
      },
      {
        title: "Free forever, designed to cost nothing",
        decision: "No subscriptions, purchases or ads. Running the product costs nothing by design: free provider tiers, one story per species instead of per scan, and a fair limit of 10 identifications per person per day.",
        why: "The goal is to bring people closer to nature, not to sell to them. Without a per-person limit, one heavy user could exhaust the shared free tier for everyone.",
        tradeoff: "No revenue, and a visible limit on long walks, said in the app's own voice rather than as an error. The paywall was already built; it stays in the code, switched off, so the decision can be reversed.",
        evidence: "Decision records 0005, 0006"
      },
      {
        title: "Launch smaller, keep the promise",
        decision: "Ship without the map. The Arboretum tab stays as “Taking root”, the app is iPhone-only and portrait-only, and it launches in English and Spanish.",

        tradeoff: "A tab that is not live yet. It reads as a promise, not a gap, and because every scan saves its location, each walker's map will be full on the day it opens.",
        evidence: "Decision record 0002"
      },

        title: "Trust is part of the product",
        decision: "Treat the first minute as a trust moment: AI keys moved off the phone, Google's consent screen says “LeafID” instead of a server address, Sign in with Apple, and account deletion inside the app.",
