    quote: "From knowing a plant's name <em>to caring about it.</em>",

      { title: "Insight", text: "Phones can already name most plants from one photo, so the name alone is a commodity. What makes a find stay with you is the second layer: what people call the plant where it comes from, how they have used it, the stories told about it. That layer lives in books, field guides and archives, and almost never reaches the person standing in front of the tree." },
      { title: "Who it's for", text: "The curious walker. Someone who notices a plant on a walk or a trip, wants to know what it is and why it matters, and would like to remember where they found it." },
      { title: "Ambition", text: [
        "Make every walk a field trip: the moment you notice a plant becomes the moment you learn its story.",
        "Give everyone a new way to connect with nature, and with the places they live in and visit.",
        "Grow from a one-off lookup into a lasting habit: a personal archive that deepens with every walk."
      ] }
    ]
  },

  features: {
    label: "The product",
    title: "Point. Capture. Reveal the depth.",
    intro: "LeafID is a new way to connect with nature, and to see a city or a place through what grows in it. Uncover the deep behind the green, and every walk becomes a way to know a place and make it your own.",
    items: [
      { kicker: "Discover", title: "Know it in seconds.", text: "Any plant, from the camera or a photo you already took." },
      { kicker: "Understand", title: "The story behind the green.", text: "Its traditional name, how people have used it, and the stories told about it." },
      { kicker: "Connect", title: "See a place differently.", text: "A park, a street, a trip abroad: what grows there carries the history of the place. Every find adds a new meaning to where you are." },
      { kicker: "Keep", title: "A field journal that writes itself.", text: "Every find, with the place and the moment you met it, and a Druid rank that grows as you explore." }
    ]
  },

  // ---- The Botanical Card showcase. Story text is real app content from the shared species cache. ----

  card: {
    label: "The signature moment",
    title: "Hold the whole story in your hand.",
    intro: "The Botanical Card is where LeafID becomes more than an identifier. Tap the card to turn it over.",
    flipLabel: "Turn the card",
    species: {
      common: "Holm oak",
      scientific: "Quercus ilex",
      known: "encina",
      rarity: "Common",
      found: "Found on a city walk in Barcelona",
      glyph: "simpleLeaf",
      colors: ["#1A5D34", "#8B5A2B", "#C9B037"],
      photo: "assets/photos/holm-oak.jpg",   // your own photo; empty = illustration
      photoAlt: "A holm oak's dark evergreen canopy against a blue sky on a Barcelona street.",
      panels: [
        { title: "Botanical Spirit", text: "“Stoic evergreen sentinel of rocky maquis, its leathery sclerophyllous leaves persist through drought and fire.”" },
        { title: "Ethnobotany", text: "In Sardinia, the acorns of Quercus ilex are leached to remove tannins, then ground into flour for traditional flatbread." }
      ]

    callouts: [
      { title: "A plant, introduced like a person.", text: "It starts with the name people give it where it grows, <em>encina</em>, so you meet it through the culture it belongs to." },
      { title: "The story behind the green.", text: "How people have used it and what it has meant to them turns a name into something you remember and care about." },
      { title: "A memory of the moment.", text: "The card keeps the colours, the place and the time of your find, so it stays yours long after the walk." }
    ],
    note: "Story text: real LeafID content for this species. Photo: my own find, on a street in Barcelona."
  },

  elements: {
    label: "Key elements",
    title: "The pieces that make it feel like LeafID.",
    intro: "Small moments, each designed to make curiosity feel rewarding.",
    scan: { k: "Home", title: "The one action", text: "A slow pulse invites the first scan; a haptic answers the press. Lime appears once per screen." , gallery: "Upload from Gallery" },
    result: { k: "Result", title: "The reveal", text: "The photo stays full-bleed while a translucent sheet rises with the name and how sure the botanist is. One clear next step.", common: "Holm oak", scientific: "Quercus ilex", badge: "94% Match Confidence", save: "Save to Herbarium" },
    herbarium: { k: "Herbarium", title: "Specimen labels", text: "Each row reads like a label in a real herbarium: the plant, when, and where." },
    rows: [
      { common: "Holm oak", when: "Found 2 days ago", where: "City street", glyph: "simpleLeaf", colors: ["#1A5D34", "#8B5A2B", "#C9B037"] },
      { common: "Grecian juniper", when: "Found last week", where: "Hillside trail", glyph: "leafSpray2", colors: ["#2E5E2E", "#5A3E8C", "#8B5A2B"] },
      { common: "Linden", when: "Found in September", where: "Riverside path", glyph: "simpleLeaf", colors: ["#3E8E41", "#F7F7F7", "#C9C4B5"] }
    ],
    voice: { k: "Voice", line: "You just noticed <em>something.</em>", text: "The first line of onboarding. The app speaks like a field journal, quiet and a little mythic." },
    rank: { k: "Druid", title: "A rank that grows with you", text: "Four ranks, each with its own glyph." },
    ladder: [
      { name: "Wandering Seed", range: "0–5 scans", glyph: "samara" },
      { name: "Forest Sprout", range: "6–15 scans", glyph: "sprout", on: true },

    achievements: [

      { title: "Week Wanderer", text: "A 7-day discovery streak", glyph: "walnutLeaf" }
    ],
    scanGlyph: "simpleLeaf",
    saveGlyph: "simpleLeaf",
    rootGlyph: "samaraClusterWide",
    root: { k: "Arboretum", title: "Taking root", text: "“Every place you've stood to look closer becomes a pin on this map. We're building it now: keep scanning, and it'll already be full the day it opens.”" }
  },

    label: "The core journey",

      { title: "Result", image: "assets/screens/result.jpg", alt: "Identification result: a full-bleed photo of a tree against blue sky, with a translucent sheet showing Platycladus orientalis, Oriental Arbor Vitae, the place and coordinates, and a Save to Herbarium button.", why: "The photo stays full-bleed under a translucent sheet, with the name, the confidence and one next step." },

  decisions: {
    label: "Leadership calls",
    title: "Five calls that shaped LeafID.",
    intro: "The strategic decisions, each written up with its context, options and trade-offs in the app's decision log.",
    items: [
      {
        title: "Own meaning, not identification",
        decision: "Position LeafID on the story behind a plant, not on naming it or caring for it. Identification comes from a specialist service; the product's effort goes into the Botanical Card.",
        why: "Competing on identification accuracy means competing with well-funded incumbents on their ground. Meaning is open space, and it is the part people remember.",
        tradeoff: "The story is written by AI, so it can be wrong or missing. I moved it to the server, cached it per species so every walker reads the same text, and set an alert for any empty result.",
        evidence: "Decision records 0003, 0004"
      },
      {
        title: "Rebuild native, keep the backend",
        decision: "Replace the first version, a web app wrapped for iOS, with a native SwiftUI app, while keeping the same backend and data.",
        why: "LeafID lives in two moments: the camera, and a card you hold and flip. A web wrapper could not give them the native camera, haptics, VoiceOver and the latest iOS materials. A cross-platform rewrite was proposed first and set aside for the same reason.",
        tradeoff: "iPhone only at launch; Android waits. Months of rebuild instead of new features, contained by keeping the backend, so no data or accounts were lost.",
        evidence: "Decision record 0001 and the Swift migration guide, April 2026"
      },
      {
        title: "Nature for everyone",
        decision: "LeafID is free for everyone, forever. No subscriptions, no purchases, no ads. Anyone with a phone and a moment of curiosity can use it.",
        why: "Connecting with nature shouldn't depend on what you can pay. To keep that promise for good, the product is designed to cost nothing to run: each plant's story is written once and shared by everyone who finds it.",
        tradeoff: "A gentle daily limit of 10 discoveries per person keeps it open for all, said in the app's own voice: “LeafID is free. Discover up to 10 plants a day.” The paywall was already built; it stays switched off.",
        evidence: "Decision records 0005, 0006"
      },
      {
        title: "Launch smaller, keep the promise",
        decision: "Ship without the map. The Arboretum tab stays as “Taking root”, the app is iPhone-only and portrait-only, and it launches in English and Spanish.",
        why: "Polishing the map before launch would have pulled the whole release behind one feature that a redesign would touch again.",
        tradeoff: "A tab that is not live yet. It reads as a promise, not a gap, and because every scan saves its location, each walker's map will be full on the day it opens.",
        evidence: "Decision record 0002"
      },
      {
        title: "Trust is part of the product",
        decision: "Treat the first minute as a trust moment: AI keys moved off the phone, Google's consent screen says “LeafID” instead of a server address, Sign in with Apple, and account deletion inside the app.",
        why: "A new user decides whether to trust an app at sign-in. A technical address or an exposed key can lose them, or the free tier, before the first scan.",
        tradeoff: "More sign-in code to own. The off-the-shelf fix was a paid custom domain, which would have broken the free-to-run rule.",
        evidence: "Decision records 0003, 0007"
      }
    ]
  },

      { label: "Impact", title: "Closer to nature, at no cost", points: ["Free forever, no ads, no purchases.", "Designed so the service never sends a bill.", "Turns any walk into a field trip."] },
