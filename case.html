      </div>
    </div>
  </section>

    <div class="wrap split">
      <div class="section-head">
        <span class="label" data-copy="bet.label"></span>
        <h2 id="bet-title" data-copy="bet.title"></h2>

      </div>

  </section>

  </section>

        <div class="section-head">

          <p class="lede" data-copy="card.intro"></p>

          </div>
          <div>
            <div data-render="callouts" data-from="card.callouts"></div>
            <p class="card-note" data-copy="card.note"></p>
          </div>
        </div>
      </div>
    </section>
  </div>

    <div class="wrap">
      <div class="section-head">
        <span class="label" data-copy="elements.label"></span>
        <h2 id="elements-title" data-copy="elements.title"></h2>
        <p class="lede" data-copy="elements.intro"></p>
      </div>
      <div class="bento app">
        <article class="tile dark t-scan">
          <div class="tile-cap"><span class="k" data-copy="elements.scan.k"></span></div>
          <div class="stage" aria-hidden="true">
            <div style="display:grid;gap:14px;justify-items:center">
              <div class="scanbtn"><span class="ring"></span><span class="ring r2"></span><span class="core"><span data-render="glyph" data-from="elements.scanGlyph"></span></span></div>
              <span class="gallery-link" data-copy="elements.scan.gallery"></span>
            </div>
          </div>
          <div class="tile-cap"><b data-copy="elements.scan.title"></b><span data-copy="elements.scan.text"></span></div>
        </article>

        <article class="tile lime t-result">
          <div class="result">
            <div class="tile-cap"><span class="k" data-copy="elements.result.k"></span><b data-copy="elements.result.title"></b><span data-copy="elements.result.text"></span></div>
            <div class="sheet" aria-hidden="true">
              <span class="grabber"></span>
              <span class="common" data-copy="elements.result.common"></span>
              <span class="sci" data-copy="elements.result.scientific"></span>
              <span class="badge" data-copy="elements.result.badge"></span>
              <span class="save"><span data-render="glyph" data-from="elements.saveGlyph"></span><span data-copy="elements.result.save"></span></span>
            </div>
          </div>
        </article>

        <article class="tile paper t-herb">
          <div class="tile-cap"><span class="k" data-copy="elements.herbarium.k"></span></div>
          <div data-render="rows" data-from="elements.rows" aria-hidden="true"></div>
          <div class="tile-cap"><b data-copy="elements.herbarium.title"></b><span data-copy="elements.herbarium.text"></span></div>
        </article>

        <article class="tile deep t-voice">
          <span class="k" data-copy="elements.voice.k"></span>
          <p class="voice" data-copy="elements.voice.line"></p>
          <div class="tile-cap"><span data-copy="elements.voice.text"></span></div>
        </article>

        <article class="tile dark t-rank">
          <div class="tile-cap"><span class="k" data-copy="elements.rank.k"></span><b data-copy="elements.rank.title"></b><span data-copy="elements.rank.text"></span></div>
          <div data-render="ladder" data-from="elements.ladder"></div>
        </article>

        <article class="tile lime t-ach">
          <div class="tile-cap"><span class="k" data-copy="elements.ach.k"></span><b data-copy="elements.ach.title"></b><span data-copy="elements.ach.text"></span></div>
          <div data-render="achievements" data-from="elements.achievements"></div>
        </article>

        <article class="tile paper t-quiet">
          <span class="k" data-copy="elements.quiet.k"></span>
          <div class="tile-cap"><b data-copy="elements.quiet.title"></b><span data-copy="elements.quiet.text"></span></div>
        </article>

        <article class="tile dark t-root">
          <div class="root">
            <div class="map" aria-hidden="true"><span data-render="glyph" data-from="elements.rootGlyph"></span></div>
            <div class="tile-cap"><span class="k" data-copy="elements.root.k"></span><span class="title" data-copy="elements.root.title"></span><p data-copy="elements.root.text"></p></div>
          </div>
        </article>
      </div>
    </div>
  </section>

          <a class="btn btn-secondary" data-link="status.testFlight"></a>
        </div>
